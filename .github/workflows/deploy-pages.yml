name: Deploy Tarahi free preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tarahi-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Tarahi source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build safe static preview
        run: node scripts/build-pages.mjs
      # The curated product photos in public/assets/products are already WebP.
      # Do not replace the hand-written seven-product catalog with auto-generated guesses.
      - name: Check generated storefront JavaScript
        run: node --check dist/app.js
      - name: Validate curated catalog and preview safety
        run: node scripts/validate-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
