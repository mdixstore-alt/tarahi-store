# Render Free preview Blueprint. No paid compute or persistent disk; demo-only storage.
# Create this as a NEW service; do not modify the MDIX service.
services:
  - type: web
    name: tarahi-store
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/tarahi-demo
      - key: STORE_LIVE
        value: 'false'
      - key: SHIPPING_FEE
        value: '250'
      - key: FREE_SHIPPING_OVER
        value: '5000'
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
